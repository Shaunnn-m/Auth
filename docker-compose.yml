services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authentication-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  migration:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: authentication-migration

    working_dir: /src

    volumes:
      - .:/src

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Authentication;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

    depends_on:
      sqlserver:
        condition: service_healthy

    command: >
      bash -c "
      dotnet tool install --global dotnet-ef --version 8.0.28 &&
      export PATH=\"$$PATH:/root/.dotnet/tools\" &&
      dotnet restore Authentication.Api/Authentication.Api.csproj &&
      dotnet ef database update
      --project Authentication.Infrastructure/Authentication.Infrastructure.csproj
      --startup-project Authentication.Api/Authentication.Api.csproj
      "


  authentication-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: authentication-api-container

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_SIGNING_KEY}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Authentication;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

    depends_on:
      migration:
        condition: service_completed_successfully


volumes:
  sqlserver-data: