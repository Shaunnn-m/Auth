services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authentication-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  authentication-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentication-api-container
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_SIGNING_KEY}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Authentication;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      - sqlserver

volumes:
  sqlserver-data: