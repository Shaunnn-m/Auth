<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your account</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f5;
    font-family: Arial, Helvetica, sans-serif;
">

    <div style="
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 8px;
        padding: 40px;
    ">

        <h1 style="
            margin-top: 0;
            color: #18181b;
        ">
            Welcome!
        </h1>

        <p style="
            color: #3f3f46;
            font-size: 16px;
            line-height: 1.6;
        ">
            Thanks for creating your account.
        </p>

        <p style="
            color: #3f3f46;
            font-size: 16px;
            line-height: 1.6;
        ">
            Please confirm your email address by clicking
            the button below.
        </p>

        <div style="
            margin: 30px 0;
        ">
            <a href="{{CONFIRMATION_LINK}}"
               style="
                   display: inline-block;
                   padding: 12px 24px;
                   background-color: #2563eb;
                   color: #ffffff;
                   text-decoration: none;
                   border-radius: 6px;
                   font-size: 16px;
               ">
                Confirm my account
            </a>
        </div>

        <p style="
            color: #71717a;
            font-size: 14px;
            line-height: 1.6;
        ">
            This confirmation link will expire in 30 minutes.
        </p>

        <p style="
            color: #71717a;
            font-size: 14px;
            line-height: 1.6;
        ">
            If you did not create this account, you can safely
            ignore this email.
        </p>

    </div>

</body>
</html>
